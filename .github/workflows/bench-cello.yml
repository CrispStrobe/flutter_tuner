name: Bench (cello, MUSERC)

# The pitch benchmark against a bowed instrument, run on CI rather than on a
# developer's machine.
#
# It is here for two reasons. The corpus is 1.4 GB and cannot live in the
# repository (CC BY 4.0 — redistributable, but this repo is not a mirror), so
# every run has to fetch it anyway; and the analysis is CPU-bound for several
# minutes, which is exactly the kind of work that should not be competing with
# an interactive session on a shared box.
#
# Manual dispatch only: nothing here gates a pull request, and it downloads
# 1.4 GB from Zenodo.

on:
  workflow_dispatch:
    inputs:
      hop:
        description: 'Analysis hop in samples (512 = 10.7 ms at 48 kHz)'
        required: false
        default: '512'
      window:
        description: 'Analysis window in samples'
        required: false
        default: '4096'
      cometbeat:
        description: 'Also run CometBeat''s engines against MUSERC'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      models:
        description: >-
          cometbeat only: also fetch the neural F0 ONNX so cb-rmvpe and
          cb-fcpe join the table. `none` = model-free engines only, `fcpe`
          adds the 43 MB one, `all` adds RMVPE's 361 MB too.
        required: false
        default: 'none'
        type: choice
        options: [none, fcpe, all]

jobs:
  cello:
    name: MUSERC cello benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # The benchmark copies the app's Flutter-free files rather than
      # path-depending on the app package; a stale copy would measure the
      # wrong code, so this fails first if they have drifted.
      - run: ./tool/sync_core.sh --check
        working-directory: bench

      - run: dart pub get
        working-directory: bench

      - name: Cache MUSERC
        id: cache-muserc
        uses: actions/cache@v4
        with:
          path: corpus/muserc
          key: muserc-sa-v1

      - name: Fetch MUSERC (Zenodo 1560651, CC BY 4.0)
        if: steps.cache-muserc.outputs.cache-hit != 'true'
        run: |
          mkdir -p corpus/muserc
          curl -sL --retry 3 -o /tmp/MUSERC.zip \
            "https://zenodo.org/records/1560651/files/MUSERC.zip?download=1"
          # Only the SA/ folder is wanted: audio plus sensor CSVs, 72 MB of
          # the 1.4 GB. The rest is high-speed video.
          unzip -q -o /tmp/MUSERC.zip 'MUSERC/SA/*' -d corpus/muserc
          rm -f /tmp/MUSERC.zip
          ls corpus/muserc/MUSERC/SA | wc -l

      # CometBeat's engines are copied into bench/lib/cometbeat/ rather than
      # depended on (a Flutter app's pubspec would drag in the SDK). The
      # --check run fails if the copies have drifted, so a number attributed
      # to CometBeat cannot come from a stale snapshot.
      - name: Fetch CometBeat and check the copies
        if: inputs.cometbeat == 'true'
        working-directory: bench
        run: |
          git clone -q --depth 1 https://github.com/CrispStrobe/cometbeat.git ../cometbeat
          ./tool/sync_cometbeat.sh --check ../cometbeat

      - name: Fetch RMVPE / FCPE ONNX
        if: inputs.cometbeat == 'true' && inputs.models != 'none'
        run: |
          mkdir -p models
          base=https://github.com/CrispStrobe/onnx_runtime_dart/releases/download/models-v1
          curl -sL --retry 3 -o models/fcpe.onnx     "$base/fcpe.onnx"
          curl -sL --retry 3 -o models/fcpe_mel.bin  "$base/fcpe_mel.bin"
          if [ "${{ inputs.models }}" = "all" ]; then
            curl -sL --retry 3 -o models/rmvpe.onnx    "$base/rmvpe.onnx"
            curl -sL --retry 3 -o models/rmvpe_mel.bin "$base/rmvpe_mel.bin"
          fi
          ls -l models

      - name: CometBeat against MUSERC
        if: inputs.cometbeat == 'true'
        working-directory: bench
        run: |
          dart run bin/cometbeat.dart \
            --corpus cello \
            --models ../models \
            --data ../corpus/muserc/MUSERC/SA | tee cometbeat-cello.txt
          {
            echo '## CometBeat engines on MUSERC'
            echo ''
            echo '```'
            cat cometbeat-cello.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run the cello benchmark
        working-directory: bench
        run: |
          dart run bin/cello.dart \
            --data ../corpus/muserc/MUSERC/SA \
            --window ${{ inputs.window || '4096' }} \
            --hop ${{ inputs.hop || '512' }} \
            | tee cello-results.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cello-results
          path: |
            bench/cello-results.txt
            bench/cometbeat-cello.txt
          retention-days: 30

      - name: Summary
        working-directory: bench
        run: |
          {
            echo '## MUSERC cello benchmark'
            echo ''
            echo '```'
            cat cello-results.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
