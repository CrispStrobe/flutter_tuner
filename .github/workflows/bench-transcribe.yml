name: Bench (transcription, MusicNet)

# How well do the transcribers actually transcribe?
#
# Every other benchmark here is FRAME-level — is this 11.6 ms slice's pitch
# right. That cannot see a transcriber splitting one note into nine. This one
# scores note events by mir_eval.transcription's rules against MusicNet's
# standard test split: ten real classical recordings, 13,589 annotated notes,
# solo piano through string and wind trios.
#
# Runs here rather than on the development VPS because the models are large
# (piano-transcription 77 MB, MT3 96 MB) and slow on a shared core.

on:
  workflow_dispatch:
    inputs:
      engines:
        description: 'Which transcribers (onnx,bp,piano,mt3,hft,oaf)'
        required: false
        default: 'onnx,bp,piano'
      models_url:
        description: >-
          Base URL holding hft_transformer.pruned.onnx and
          onsets_and_frames.onnx. The hFT and O&F arms are SKIPPED without
          it: those two graphs are the output of the Kaggle export kernel
          (tool/kaggle/onnx-export) and are not published anywhere a runner
          can reach, so there is no default that would work.
        required: false
        default: ''
      limit:
        description: 'Pieces to use (0 = all 10)'
        required: false
        default: '0'

jobs:
  transcribe:
    name: Note-level transcription
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - run: ./tool/sync_core.sh --check
        working-directory: bench

      - run: dart pub get
        working-directory: bench

      # The test split is ~205 MB of an 11 GB tarball. The cache makes the
      # download a one-off per key; without it every run streams the whole
      # archive to reach members that sit at the end of it.
      - name: Cache MusicNet test split
        id: cache
        uses: actions/cache@v4
        with:
          path: corpus/musicnet
          key: musicnet-test-split-v1

      - name: Fetch MusicNet test split (Zenodo 5120004, CC BY 4.0)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p corpus/musicnet
          curl -sL --retry 3 \
            "https://zenodo.org/records/5120004/files/musicnet.tar.gz?download=1" \
          | tar -xz -C corpus/musicnet --wildcards \
              'musicnet/test_data/*' 'musicnet/test_labels/*'
          echo "audio: $(ls corpus/musicnet/musicnet/test_data | wc -l), labels: $(ls corpus/musicnet/musicnet/test_labels | wc -l)"

      # Use the same pinned CrispASR build as the Linux app. A failed
      # native build still allows the pure-Dart benchmark to run.
      - name: Build libcrispasr (for the ggml arms)
        id: crispasr
        continue-on-error: true
        run: |
          tool/crispasr/build.sh linux
          lib=tool/crispasr/linux/lib/libcrispasr.so
          test -f "$lib"
          deps=$(ldd "$lib")
          printf '%s\n' "$deps"
          if grep -qi 'not found' <<< "$deps"; then
            echo "::error::unresolved libcrispasr dependencies"
            exit 1
          fi

      # Say plainly which arms this run can measure, so a summary showing one
      # engine is never mistaken for a comparison of four.
      - name: Which arms will run
        run: |
          if [ "${{ steps.crispasr.outcome }}" = "success" ]; then
            echo "libcrispasr built: ggml arms (bp, piano, mt3) available"
          else
            echo "::warning::libcrispasr NOT built — only the pure-Dart arms run"
          fi

      # The two spectrogram models, if this run was given somewhere to get
      # them. Absent, `transcribe_eval.dart` prints "model not found" for
      # each and scores the arms it does have — never a silent omission.
      - name: Fetch the exported spectrogram models
        if: inputs.models_url != ''
        run: |
          mkdir -p corpus/onnx
          for f in hft_transformer.pruned.onnx onsets_and_frames.onnx; do
            curl -sL --retry 3 -o "corpus/onnx/$f" "${{ inputs.models_url }}/$f" \
              || echo "::warning::could not fetch $f"
          done
          ls -l corpus/onnx || true

      - name: Transcribe and score
        working-directory: bench
        env:
          CRISPTUNER_CRISPASR_LIB: ${{ github.workspace }}/tool/crispasr/linux/lib/libcrispasr.so
        run: |
          dart run bin/transcribe_eval.dart \
            --data ../corpus/musicnet \
            --engines "${{ inputs.engines }}" \
            --hft-onnx ../corpus/onnx/hft_transformer.pruned.onnx \
            --oaf-onnx ../corpus/onnx/onsets_and_frames.onnx \
            --limit ${{ inputs.limit }} | tee transcribe.txt

      - name: Summary
        working-directory: bench
        run: |
          {
            echo '## Note-level transcription — MusicNet test split'
            echo ''
            echo '```'
            cat transcribe.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: transcribe-results
          path: bench/transcribe.txt
          retention-days: 30
