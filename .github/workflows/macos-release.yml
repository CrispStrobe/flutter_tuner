name: macOS Release (App Store)

# Builds, signs and uploads the macOS app to App Store Connect.
#
# Lands on the SAME app record as iOS, because the macOS target's bundle id is
# com.crispstrobe.CrispTuner — identical to iOS — and that id is registered
# UNIVERSAL in the developer portal. App Store Connect serves multiple platforms
# from one record only when the bundle id matches, which also avoids creating a
# second app record (one of the few browser-only steps).
#
# Triggers:
#   * push a tag matching macos-v*  -> full build + upload
#   * manual "Run workflow"         -> dry_run=true (default) builds and signs
#                                      but does NOT upload
#
# Why this does NOT use `xcodebuild -exportArchive` like ios-release.yml:
# -exportArchive re-signs each binary from a DEFAULT entitlement set, which on
# macOS drops `com.apple.security.app-sandbox` — a Mac App Store requirement and
# therefore an automatic rejection. So we sign the .app explicitly with the
# project's own AppStore.entitlements, then wrap it with productbuild.
#
# Required repo secrets (in addition to the ASC_* set shared with iOS):
#   MAC_SIGNING_P12_BASE64    base64 .p12 carrying BOTH the "Apple Distribution"
#                             and "3rd Party Mac Developer Installer" identities
#   MAC_SIGNING_P12_PASSWORD  password for that .p12
#   ASC_PROFILE_MACOS_BASE64  base64 of the MAC_APP_STORE .provisionprofile

on:
  push:
    tags: ['macos-v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build & sign only, do NOT upload'
        type: boolean
        default: true

env:
  BUNDLE_ID: com.crispstrobe.CrispTuner
  PROFILE_NAME: CrispTuner MacAppStore
  APP_NAME: CrispTuner

jobs:
  build-upload:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # pubspec.yaml is the single source of truth for the version: the
      # plists read $(FLUTTER_BUILD_NAME)/$(FLUTTER_BUILD_NUMBER), the About
      # screen reads PackageInfo out of the built bundle, and the upload step
      # below greps pubspec. The one thing NOT derived from it is the git tag,
      # which is typed by hand — so `git tag v2.2.0` against a pubspec still
      # reading 2.1.9 would cheerfully build, sign and upload 2.1.9 under a
      # v2.2.0 tag, and nothing downstream would notice.
      - name: Tag must match the version in pubspec.yaml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          PUBSPEC=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//; s/+.*//')
          TAG="${GITHUB_REF_NAME#v}"
          TAG="${TAG#macos-v}"
          if [ "$PUBSPEC" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME says $TAG but pubspec.yaml says $PUBSPEC."
            echo "Bump pubspec.yaml (version: x.y.z+BUILD) and re-tag."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches pubspec version $PUBSPEC"


      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Disable Swift Package Manager (use pure CocoaPods)
        run: flutter config --no-enable-swift-package-manager

      - name: Resolve dependencies
        run: flutter pub get

      - name: Validate the entitlements actually parse
        # `plutil -lint` is NOT sufficient: AMFI's parser is far simpler than the
        # generic plist parser and fails on angle brackets inside an XML comment,
        # which lints clean and then dies minutes later mid-signing. Ad-hoc
        # signing needs no keychain, so this check is instant.
        run: |
          set -euo pipefail
          plutil -lint macos/Runner/AppStore.entitlements
          cp /bin/echo "$RUNNER_TEMP/entitlement-probe"
          codesign --force --sign - \
            --entitlements macos/Runner/AppStore.entitlements \
            "$RUNNER_TEMP/entitlement-probe"
          echo "entitlements parse cleanly"

      - name: Import signing certificates into a temp keychain
        # NOT DIST_CERT_P12_BASE64: that one carries only the Apple Distribution
        # identity. The Mac App Store needs a SECOND identity to sign the .pkg,
        # so MAC_SIGNING_P12_BASE64 must contain both.
        env:
          P12_B64: ${{ secrets.MAC_SIGNING_P12_BASE64 }}
          P12_PW: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/crisptuner-macos.keychain-db"
          KC_PW="ci-$(uuidgen)"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$P12_PW" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KC_PW" "$KC" >/dev/null
          echo "KC=$KC" >> "$GITHUB_ENV"
          security find-identity -v "$KC"
          # Fail loudly and early rather than 40 minutes later at productbuild.
          security find-identity -v "$KC" | grep -q "Apple Distribution" \
            || { echo "::error::Apple Distribution identity missing from MAC_SIGNING_P12_BASE64"; exit 1; }
          security find-identity -v "$KC" | grep -q "3rd Party Mac Developer Installer" \
            || { echo "::error::3rd Party Mac Developer Installer identity missing — MAC_SIGNING_P12_BASE64 must contain BOTH"; exit 1; }

      - name: Install provisioning profile
        env:
          PROFILE_B64: ${{ secrets.ASC_PROFILE_MACOS_BASE64 }}
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/app.provisionprofile"
          echo "$PROFILE_B64" | base64 --decode > "$P"
          plist="$(security cms -D -i "$P")"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<<"$plist")
          name=$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<<"$plist")
          DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$DIR"; cp "$P" "$DIR/$uuid.provisionprofile"
          echo "installed '$name' ($uuid)"

      - name: Write App Store Connect API key
        env:
          P8_B64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys" "$HOME/.private_keys" .appstoreconnect
          echo "$P8_B64" | base64 --decode > ".appstoreconnect/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"
          grep -q "BEGIN PRIVATE KEY" ".appstoreconnect/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
            || { echo "::error::Decoded .p8 is not a PEM private key"; exit 1; }
          cp ".appstoreconnect/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" "$HOME/.appstoreconnect/private_keys/"
          cp ".appstoreconnect/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" "$HOME/.private_keys/"

      - name: Build the .app (unsigned — we sign explicitly below)
        run: |
          set -euo pipefail
          VER=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//; s/+.*//')
          BUILD=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          echo "VER=$VER" >> "$GITHUB_ENV"; echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          # GEM_HOME/GEM_PATH are unset on CI, but clearing them keeps this
          # identical to the documented local invocation (a stale chruby GEM_PATH
          # makes pod fail, Flutter skip pod install, and produce NO .app).
          PATH="/usr/bin:$PATH" env -u GEM_HOME -u GEM_PATH -u RUBYOPT \
            flutter build macos --release --build-name="$VER" --build-number="$BUILD"
          # Flutter names the bundle from PRODUCT_NAME, not the display name.
          # Glob it rather than guessing, and fail if it is absent.
          APP=$(ls -d build/macos/Build/Products/Release/*.app 2>/dev/null | head -1)
          test -n "$APP" || { echo "::error::no .app produced — did pod install run?"; exit 1; }
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "built: $APP"

      - name: Sign the .app with the App Store entitlements
        run: |
          set -euo pipefail
          IDENT=$(security find-identity -v "$KC" | grep -oE 'Apple Distribution: [^"]+' | head -1)
          echo "signing identity: $IDENT"
          # A Mac App Store binary must carry embedded.provisionprofile.
          cp "$RUNNER_TEMP/app.provisionprofile" "$APP/Contents/embedded.provisionprofile"
          # Sign inside-out: nested Mach-O first, then the bundle. Library
          # validation is ON for MAS, so anything not signed with this Team ID
          # refuses to load at launch.
          find "$APP/Contents/Frameworks" -maxdepth 1 -name '*.framework' -print0 2>/dev/null \
            | xargs -0 -I{} codesign --force --timestamp --options runtime --keychain "$KC" --sign "$IDENT" {} || true
          find "$APP/Contents/Frameworks" -name '*.dylib' -print0 2>/dev/null \
            | xargs -0 -I{} codesign --force --timestamp --options runtime --keychain "$KC" --sign "$IDENT" {} || true
          # --keychain pins the search list; without it codesign can land on
          # login.keychain-db, whose keys are unusable non-interactively.
          codesign --force --timestamp --options runtime --keychain "$KC" --sign "$IDENT" \
            --entitlements macos/Runner/AppStore.entitlements "$APP"
          echo "--- signed entitlements ---"
          codesign -d --entitlements - --xml "$APP" 2>/dev/null | plutil -p - || true
          # Verify what actually got signed in, rather than waiting for Apple's
          # async processing to reject it.
          ENTS=$(codesign -d --entitlements - --xml "$APP" 2>/dev/null)
          grep -q "com.apple.security.app-sandbox" <<<"$ENTS" \
            || { echo "::error::app-sandbox missing from the signed .app — Mac App Store rejects this"; exit 1; }
          grep -q "com.apple.application-identifier" <<<"$ENTS" \
            || { echo "::error::application-identifier missing from the signed .app (altool warning 90886)"; exit 1; }
          grep -q "com.apple.security.device.audio-input" <<<"$ENTS" \
            || { echo "::error::audio-input missing — the tuner could not use the microphone"; exit 1; }
          test -f "$APP/Contents/Resources/PrivacyInfo.xcprivacy" \
            || echo "::warning::PrivacyInfo.xcprivacy not found in Resources"
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | tail -3

      - name: Build the signed .pkg
        run: |
          set -euo pipefail
          INST=$(security find-identity -v "$KC" \
            | grep -oE '3rd Party Mac Developer Installer: [^"]+' | head -1)
          echo "installer identity: $INST"
          PKG="$RUNNER_TEMP/${APP_NAME}-${VER}-${BUILD}.pkg"
          productbuild --component "$APP" /Applications --keychain "$KC" --sign "$INST" "$PKG"
          echo "PKG=$PKG" >> "$GITHUB_ENV"
          pkgutil --check-signature "$PKG" | head -5

      - name: Upload .pkg artifact
        # Uploaded before the altool steps so a failed delivery never means
        # rebuilding from scratch.
        uses: actions/upload-artifact@v4
        with:
          name: crisptuner-macos-pkg
          path: ${{ env.PKG }}
          if-no-files-found: error

      - name: Validate with altool
        run: |
          set -euo pipefail
          xcrun altool --validate-app -f "$PKG" --type macos \
            --apiKey "${{ secrets.ASC_KEY_ID }}" --apiIssuer "${{ secrets.ASC_ISSUER_ID }}" \
            2>&1 | tail -20

      - name: Upload to App Store Connect
        if: github.event_name == 'push' || inputs.dry_run == false
        run: |
          set -euo pipefail
          xcrun altool --upload-package "$PKG" --type macos \
            --apple-id "${{ secrets.ASC_APP_ID }}" \
            --bundle-id "${{ env.BUNDLE_ID }}" \
            --bundle-version "$BUILD" --bundle-short-version-string "$VER" \
            --apiKey "${{ secrets.ASC_KEY_ID }}" --apiIssuer "${{ secrets.ASC_ISSUER_ID }}" \
            2>&1 | tail -20

      - name: Note when the upload was skipped
        if: github.event_name != 'push' && inputs.dry_run != false
        run: echo "::notice::dry_run — built and signed, upload SKIPPED. Re-run with dry_run=false to upload."
