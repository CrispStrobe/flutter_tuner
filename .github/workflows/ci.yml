name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned, not `channel: stable`. Everything here floated on stable
          # except the screenshot job, so a Flutter release could change the
          # binary we ship between one build and the next without a commit —
          # and did: CI and the release workflows were on 3.47.4 while the
          # checked-in goldens were recorded on 3.44.4. Bump this deliberately.
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned, not `channel: stable`. Everything here floated on stable
          # except the screenshot job, so a Flutter release could change the
          # binary we ship between one build and the next without a commit —
          # and did: CI and the release workflows were on 3.47.4 while the
          # checked-in goldens were recorded on 3.44.4. Bump this deliberately.
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      # Golden images are host-renderer specific, so they are verified in the
      # macOS job below. This previously ran `--update-goldens`, which silently
      # REGENERATED the images every run — the golden tests could never fail.
      #
      # `preview` is excluded too: those are local layout renders for a human
      # to look at, not assertions, and they are not checked in.
      - run: flutter test -x golden -x preview

  bench:
    name: Bench (pure Dart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # The benchmark copies the app's three Flutter-free files rather than
      # path-depending on this package, which would drag in the Flutter SDK.
      # A benchmark of a stale copy of the maths measures nothing, so the copy
      # is verified before anything else.
      - run: ./tool/sync_core.sh --check
        working-directory: bench
      - run: dart pub get
        working-directory: bench
      - run: dart analyze
        working-directory: bench
      # The corpus lives outside the repo, so this is the unit tests only:
      # the histogram, the FFT difference function, the stiffness fit.
      - run: dart test
        working-directory: bench

  test-goldens:
    name: Test (goldens, macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned, not `channel: stable`. Everything here floated on stable
          # except the screenshot job, so a Flutter release could change the
          # binary we ship between one build and the next without a commit —
          # and did: CI and the release workflows were on 3.47.4 while the
          # checked-in goldens were recorded on 3.44.4. Bump this deliberately.
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      # No --update-goldens: this must compare against the checked-in PNGs.
      - run: flutter test -t golden
      - name: Upload golden diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/failures/
          if-no-files-found: ignore

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          # Pinned, not `channel: stable`. Everything here floated on stable
          # except the screenshot job, so a Flutter release could change the
          # binary we ship between one build and the next without a commit —
          # and did: CI and the release workflows were on 3.47.4 while the
          # checked-in goldens were recorded on 3.44.4. Bump this deliberately.
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: CrispASR (android)
        uses: ./.github/actions/crispasr
        with:
          target: android
      - run: flutter pub get
      - run: flutter build apk --debug
      - run: |
          unzip -l build/app/outputs/flutter-apk/app-debug.apk | grep -q 'lib/arm64-v8a/libcrispasr.so'
          # Google Play rejects 4 KB-aligned libraries for Android 15+ targets.
          for so in android/app/src/main/jniLibs/arm64-v8a/*.so; do
            readelf -lW "$so" | awk '$1=="LOAD" && $NF!="0x4000" {bad=1} END {exit bad}' \
              || { echo "::error::$so is not 16 KB page-aligned"; exit 1; }
          done

  crispasr-native:
    name: CrispASR models (Linux, end to end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: CrispASR (linux)
        uses: ./.github/actions/crispasr
        with:
          target: linux
      - run: flutter pub get
      # Downloads Basic Pitch (110 KB) through the real ModelStore, checks
      # its SHA-256, and transcribes a synthesised chord with the real
      # libcrispasr — the whole path the app takes, minus the UI.
      - run: flutter test test/crispasr_native_test.dart
        env:
          CRISPTUNER_CRISPASR_LIB: ${{ github.workspace }}/tool/crispasr/linux/lib/libcrispasr.so

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned, not `channel: stable`. Everything here floated on stable
          # except the screenshot job, so a Flutter release could change the
          # binary we ship between one build and the next without a commit —
          # and did: CI and the release workflows were on 3.47.4 while the
          # checked-in goldens were recorded on 3.44.4. Bump this deliberately.
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: CrispASR (wasm)
        uses: ./.github/actions/crispasr
        with:
          target: wasm
      - run: flutter pub get
      - run: flutter build web --dart-define=CRISPTUNER_CRISPASR_WASM=true
      - run: test -f build/web/crispasr/libwhisper.wasm && test -f build/web/crispasr/worker.js
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/
          retention-days: 7

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned, not `channel: stable`. Everything here floated on stable
          # except the screenshot job, so a Flutter release could change the
          # binary we ship between one build and the next without a commit —
          # and did: CI and the release workflows were on 3.47.4 while the
          # checked-in goldens were recorded on 3.44.4. Bump this deliberately.
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: CrispASR (apple)
        uses: ./.github/actions/crispasr
        with:
          target: apple
      - run: flutter pub get
      - run: flutter build ios --no-codesign
      # Embedded by the "Embed CrispASR" build phase, thinned to arm64.
      - run: |
          F=build/ios/iphoneos/Runner.app/Frameworks/crispasr.framework/crispasr
          test -f "$F" && lipo -info "$F"

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned, not `channel: stable`. Everything here floated on stable
          # except the screenshot job, so a Flutter release could change the
          # binary we ship between one build and the next without a commit —
          # and did: CI and the release workflows were on 3.47.4 while the
          # checked-in goldens were recorded on 3.44.4. Bump this deliberately.
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: CrispASR (apple)
        uses: ./.github/actions/crispasr
        with:
          target: apple
      - run: flutter pub get
      - run: flutter build macos
      - run: |
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          F="$APP/Contents/Frameworks/crispasr.framework/Versions/A/crispasr"
          test -f "$F" && lipo -info "$F"
          # Embedded, never linked: the app must still launch on macOS 10.15.
          ! otool -L "$APP/Contents/MacOS/"* | grep -q crispasr.framework

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned, not `channel: stable`. Everything here floated on stable
          # except the screenshot job, so a Flutter release could change the
          # binary we ship between one build and the next without a commit —
          # and did: CI and the release workflows were on 3.47.4 while the
          # checked-in goldens were recorded on 3.44.4. Bump this deliberately.
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libasound2-dev
      - name: CrispASR (linux)
        uses: ./.github/actions/crispasr
        with:
          target: linux
      - run: flutter pub get
      - run: flutter build linux
      - run: |
          LIB=build/linux/x64/release/bundle/lib/libcrispasr.so
          test -e "$LIB"
          # Every dependency resolves from the bundle or the base system.
          ! ldd "$LIB" | grep "not found"

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned, not `channel: stable`. Everything here floated on stable
          # except the screenshot job, so a Flutter release could change the
          # binary we ship between one build and the next without a commit —
          # and did: CI and the release workflows were on 3.47.4 while the
          # checked-in goldens were recorded on 3.44.4. Bump this deliberately.
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: CrispASR (windows)
        uses: ./.github/actions/crispasr
        with:
          target: windows
      - run: flutter pub get
      - run: flutter build windows
      - run: if (-not (Test-Path build\windows\x64\runner\Release\crispasr.dll)) { exit 1 }
        shell: pwsh
