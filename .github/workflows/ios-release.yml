name: iOS Release (App Store)

# Builds, signs and uploads the iOS app to App Store Connect from CI.
#
# Triggers:
#   * push a tag matching v*   -> full build + upload (a real release)
#   * manual "Run workflow"    -> dry_run=true builds and signs WITHOUT
#                                 uploading, which validates signing safely
#
# Required repo secrets:
#   ASC_API_KEY_P8_BASE64  base64 of AuthKey_<KEYID>.p8   (base64, never raw PEM:
#                          a multi-line PEM pasted into a secret loses newlines
#                          and xcodebuild then reports a truncated ASN.1 key)
#   ASC_KEY_ID             App Store Connect API key id
#   ASC_ISSUER_ID          App Store Connect issuer id
#   ASC_APP_ID             numeric app id (NOT the bundle id)
#   ASC_TEAM_ID            Apple Developer team id
#   DIST_CERT_P12_BASE64   base64 of the "Apple Distribution" .p12 (cert + key)
#   DIST_CERT_PASSWORD     password for that .p12
#   ASC_PROFILE_BASE64     base64 of the IOS_APP_STORE .mobileprovision
#
# The build number comes from pubspec.yaml (version: x.y.z+BUILD). Bump BUILD
# before tagging or Apple rejects a duplicate CFBundleVersion. Once a version is
# already approved, the MARKETING version (x.y.z) must go up too — a build-only
# bump is rejected as ITMS-90062.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build & sign only, do NOT upload'
        type: boolean
        default: true

env:
  BUNDLE_ID: com.crispstrobe.CrispTuner
  PROFILE_NAME: CrispTuner AppStore CI

jobs:
  build-upload:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # pubspec.yaml is the single source of truth for the version: the
      # plists read $(FLUTTER_BUILD_NAME)/$(FLUTTER_BUILD_NUMBER), the About
      # screen reads PackageInfo out of the built bundle, and the upload step
      # below greps pubspec. The one thing NOT derived from it is the git tag,
      # which is typed by hand — so `git tag v2.2.0` against a pubspec still
      # reading 2.1.9 would cheerfully build, sign and upload 2.1.9 under a
      # v2.2.0 tag, and nothing downstream would notice.
      - name: Tag must match the version in pubspec.yaml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          PUBSPEC=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//; s/+.*//')
          TAG="${GITHUB_REF_NAME#v}"
          TAG="${TAG#macos-v}"
          if [ "$PUBSPEC" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME says $TAG but pubspec.yaml says $PUBSPEC."
            echo "Bump pubspec.yaml (version: x.y.z+BUILD) and re-tag."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches pubspec version $PUBSPEC"


      - uses: subosito/flutter-action@v2
        with:
          # Pinned, not `channel: stable`. Everything here floated on stable
          # except the screenshot job, so a Flutter release could change the
          # binary we ship between one build and the next without a commit —
          # and did: CI and the release workflows were on 3.47.4 while the
          # checked-in goldens were recorded on 3.44.4. Bump this deliberately.
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      # Flutter 3.44's SPM/CocoaPods hybrid is unbuildable by a bare xcodebuild
      # (plugins get double-included -> "redefinition of <symbol>"). Force pure
      # CocoaPods on the runner, which re-adds SPM on build otherwise.
      - name: Disable Swift Package Manager (use pure CocoaPods)
        run: flutter config --no-enable-swift-package-manager

      - name: Resolve dependencies
        run: flutter pub get

      - name: Import signing certificate into a temp keychain
        env:
          P12_B64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          P12_PW: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/crisptuner-signing.keychain-db"
          KC_PW="ci-$(uuidgen)"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$P12_PW" \
            -T /usr/bin/codesign -T /usr/bin/security
          # keep the default (login) keychain on the search list too
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" >/dev/null
          security find-identity -v -p codesigning "$KC"
          # Fail fast rather than 15 minutes later at the export step.
          security find-identity -v -p codesigning "$KC" | grep -q "Apple Distribution" \
            || { echo "::error::No Apple Distribution identity in the imported .p12"; exit 1; }

      - name: Install provisioning profile
        env:
          PROFILE_B64: ${{ secrets.ASC_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/crisptuner.mobileprovision"
          # Name the installed file by the profile's UUID and put it in BOTH the
          # legacy dir and the Xcode 16+/26 dir (Xcode moved this location).
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' \
            /dev/stdin <<<"$(security cms -D -i "$RUNNER_TEMP/crisptuner.mobileprovision")")
          for DIR in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$DIR"
            cp "$RUNNER_TEMP/crisptuner.mobileprovision" "$DIR/$UUID.mobileprovision"
          done
          echo "installed profile UUID $UUID"

      - name: Write App Store Connect API key
        env:
          P8_B64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys" "$HOME/.private_keys" .appstoreconnect
          echo "$P8_B64" | base64 --decode > ".appstoreconnect/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"
          grep -q "BEGIN PRIVATE KEY" ".appstoreconnect/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
            || { echo "::error::Decoded .p8 is not a PEM private key — check ASC_API_KEY_P8_BASE64"; exit 1; }
          # altool searches these locations for AuthKey_<id>.p8
          cp ".appstoreconnect/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" "$HOME/.appstoreconnect/private_keys/"
          cp ".appstoreconnect/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" "$HOME/.private_keys/"

      - name: Write ExportOptions.plist (manual signing)
        run: |
          cat > .appstoreconnect/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.ASC_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>${{ env.BUNDLE_ID }}</key><string>${{ env.PROFILE_NAME }}</string></dict>
            <key>destination</key><string>export</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF

      - name: Build & sign IPA (xcodebuild, manual signing)
        run: |
          set -euo pipefail
          # Let Flutter generate its ephemeral iOS config (Generated.xcconfig) and
          # the CocoaPods integration WITHOUT building — this sets the
          # Flutter.framework search paths a bare xcodebuild would otherwise miss.
          PATH="/usr/bin:$PATH" flutter build ios --release --config-only --no-codesign
          PATH="/usr/bin:$PATH" env -u GEM_HOME -u GEM_PATH -u RUBYOPT \
            pod install --project-directory=ios
          # ARCHIVE UNSIGNED. A bare `xcodebuild archive` insists on an iOS
          # *Development* profile for on-device signing, which CI cannot have
          # (only the Distribution key is present). Sign at export instead — and
          # never use -allowProvisioningUpdates, which creates a Development cert
          # and silently REVOKES a Distribution cert to stay under Apple's cap.
          PATH="/usr/bin:$PATH" xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/ios/archive/Runner.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            clean archive
          PATH="/usr/bin:$PATH" xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist .appstoreconnect/ExportOptions.plist
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          echo "built: $IPA"

      - name: Verify signature and privacy manifest
        run: |
          set -euo pipefail
          rm -rf /tmp/ipa_check && mkdir -p /tmp/ipa_check
          unzip -qo "$IPA" -d /tmp/ipa_check
          # "EXPORT SUCCEEDED" alone is not proof the bundle is correctly signed.
          codesign --verify --deep --strict --verbose=2 /tmp/ipa_check/Payload/Runner.app
          test -f /tmp/ipa_check/Payload/Runner.app/PrivacyInfo.xcprivacy \
            || { echo "::error::PrivacyInfo.xcprivacy missing from the bundle (ITMS-91053)"; exit 1; }
          # The App Store tile is pulled from the build's 1024px marketing icon;
          # without it Apple falls back to a 167px device icon and the tile stays blank.
          python3 - <<'PY'
          import subprocess, sys
          out = subprocess.run(["xcrun","assetutil","--info",
              "/tmp/ipa_check/Payload/Runner.app/Assets.car"],
              capture_output=True, text=True).stdout
          if '"SizeOnDisk"' not in out or "1024" not in out:
              print("::warning::could not confirm a 1024px icon rendition in Assets.car")
          else:
              print("Assets.car contains a 1024px rendition")
          PY

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: crisptuner-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

      - name: Validate with App Store Connect
        run: |
          set -euo pipefail
          # Catches signing/metadata defects in ~5 minutes instead of losing a
          # whole build cycle to async processing rejections.
          # NOTE: camelCase --apiKey/--apiIssuer works on every altool version;
          # the kebab-case spelling is silently ignored by older ones.
          xcrun altool --validate-app -f "$IPA" --type ios \
            --apiKey "${{ secrets.ASC_KEY_ID }}" \
            --apiIssuer "${{ secrets.ASC_ISSUER_ID }}"

      - name: Upload to App Store Connect
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: |
          set -euo pipefail
          VER=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//; s/+.*//')
          BUILD=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          echo "Uploading $VER (build $BUILD)"
          xcrun altool --upload-package "$IPA" --type ios \
            --apple-id "${{ secrets.ASC_APP_ID }}" \
            --bundle-id "${{ env.BUNDLE_ID }}" \
            --bundle-version "$BUILD" \
            --bundle-short-version-string "$VER" \
            --apiKey "${{ secrets.ASC_KEY_ID }}" \
            --apiIssuer "${{ secrets.ASC_ISSUER_ID }}"
