name: Bench (platforms)

# What the detectors and the transcription model cost on hardware nobody in
# this project owns.
#
# Every timing in REPORT.md before this workflow came from one shared VPS core
# under a load average that ranged from 2 to 30, and the report says so in
# several places. The questions that matters to shipping — can a phone or a
# laptop run this — deserve a number rather than an extrapolation, and
# GitHub's macos runners are Apple Silicon, so one of those answers is simply
# available.
#
# No corpus: the signal is synthesised, so every platform measures identical
# work and the numbers are comparable across the matrix.

on:
  workflow_dispatch:
  # Also on a push that touches the detectors, because a performance
  # regression on a platform nobody develops on is otherwise invisible.
  push:
    branches: [main]
    paths:
      - lib/detectors.dart
      - lib/fft_real.dart
      - lib/swipe.dart
      - bench/bin/platform_timing.dart
      - bench/bin/fft_real_timing.dart

jobs:
  timing:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: Apple Silicon (macOS)
          - os: ubuntu-latest
            label: x86-64 (Linux)
          - os: windows-latest
            label: x86-64 (Windows)
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - run: dart pub get
        working-directory: bench

      - name: Machine
        run: |
          echo "runner: ${{ matrix.os }}"
          if [ "${{ runner.os }}" = "macOS" ]; then
            sysctl -n machdep.cpu.brand_string || true
            sysctl -n hw.perflevel0.physicalcpu 2>/dev/null || true
          elif [ "${{ runner.os }}" = "Linux" ]; then
            grep -m1 'model name' /proc/cpuinfo || true
          fi
        shell: bash

      - name: Time it
        working-directory: bench
        run: dart run bin/platform_timing.dart ../assets/models/basic_pitch.onnx | tee timing.txt
        shell: bash

      # The isolate-pool arms (REPORT.md §19). Measured here rather than on
      # the VPS because the decision they drive — how many worker isolates to
      # spawn inside the transcription isolate — depends on core count and
      # memory bandwidth, and the VPS has four shared cores and eleven
      # tenants. Each arm runs as its OWN PROCESS: a shared process lets
      # Dart's JIT warm later arms and overstates the win (§19.1).
      - name: Isolate pool A/B
        working-directory: bench
        run: |
          # One arm per process: a shared process lets Dart's JIT warm later
          # arms and overstates the win (REPORT.md §19.1).
          #
          # Two further defences against the artefact §23 traced. A throwaway
          # run first, because the FIRST process of a sequence pays cold page
          # cache for the model and the Dart snapshot, and whichever arm
          # holds that slot looks slow — which is exactly how an unexplained
          # "6-17%" got published. And reps OUTER, arms INNER, so every arm
          # takes every ordinal position rather than one arm always leading.
          dart run bin/dart_parallel.dart --only "base" --reps 2 > /dev/null
          for rep in 1 2 3; do
            for arm in "base" "runAsync no pool" "parallelize(2)" \
                       "parallelize(2, poolConv)" "parallelize(4, poolConv)"; do
              dart run bin/dart_parallel.dart --only "$arm" --reps 5
            done
          done | tee pool.txt
        shell: bash

      # The real-input FFT (REPORT.md §34). Same discipline as the arm above,
      # for the same reason: one arm per process, a throwaway first, reps
      # OUTER and arms INNER.
      - name: Real-input FFT A/B
        working-directory: bench
        run: |
          arms=("spectrum complex 2048" "spectrum real 2048" \
                "spectrum complex 4096" "spectrum real 4096" \
                "spectrum complex 8192" "spectrum real 8192" \
                "autocorr complex 2048/4096" "autocorr real 2048/4096")
          dart run bin/fft_real_timing.dart --only "spectrum complex 4096" \
            > /dev/null
          for rep in 1 2 3; do
            for arm in "${arms[@]}"; do
              dart run bin/fft_real_timing.dart --only "$arm"
            done
          done | tee fft.txt

          # And the same on dart2js, which is the platform this file exists
          # for. dart2js does not pass `main` a command line, so the arm is
          # fixed at compile time — which is still one arm per process.
          n=0
          for arm in "${arms[@]}"; do
            n=$((n+1))
            dart compile js -O2 -Darm="$arm" -o "fftjs$n.js" \
              bin/fft_real_timing.dart > /dev/null
          done
          node fftjs3.js > /dev/null
          for rep in 1 2 3; do
            for n in 1 2 3 4 5 6 7 8; do node "fftjs$n.js"; done
          done | tee fft_js.txt
        shell: bash

      - name: Summary
        working-directory: bench
        run: |
          {
            echo "## ${{ matrix.label }}"
            echo ''
            echo '```'
            cat timing.txt
            echo '```'
            echo ''
            echo '### Isolate pool (§19)'
            echo ''
            echo '```'
            cat pool.txt
            echo '```'
            echo ''
            echo '### Real-input FFT, native (§34)'
            echo ''
            echo '```'
            cat fft.txt
            echo '```'
            echo ''
            echo '### Real-input FFT, dart2js (§34)'
            echo ''
            echo '```'
            cat fft_js.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: timing-${{ matrix.os }}
          path: |
            bench/timing.txt
            bench/pool.txt
            bench/fft.txt
            bench/fft_js.txt
          retention-days: 30
