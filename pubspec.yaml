name: flutter_tuner
description: "CrispTuner — a chromatic instrument tuner with historical temperaments, alternate and custom tunings, live pitch detection and spectrum analysis."
publish_to: 'none'
version: 2.2.0+7

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Core audio (mobile)
  record: ^6.0.0
  fftea: ^1.5.0
  # Pure-Dart ONNX inference for the transcription mode: no FFI, so it does
  # not add a native build to any of the six platforms. Pinned to the repo
  # rather than pub because the published 0.10.7 predates the convolution
  # work that made Basic Pitch 3x faster (1509 ms -> 498 ms per 2 s window);
  # move to a pub version once one is published.
  onnx_runtime_dart:
    git:
      url: https://github.com/CrispStrobe/onnx_runtime_dart.git
      ref: main

  # Optional second transcription runtime (lib/crispasr_backend.dart). Pure
  # Dart FFI: it does NOT bundle libcrispasr, so the backend reports itself
  # unavailable unless a host has the native library. Declared here rather
  # than vendored so the conditional export compiles; the web build never
  # reaches it.
  crispasr: ^0.8.33

  flutter_pcm_sound: ^3.3.3

  # Utilities
  collection: ^1.18.0
  intl: any
  package_info_plus: ^8.0.0
  shared_preferences: ^2.2.2
  # Web support
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Not shipped any more: lib/detectors.dart carries YIN itself, so that the
  # difference function can be computed by FFT instead of the package's
  # O(N^2) double loop. Kept here so test/detector_equivalence_test.dart can
  # go on asserting, frame by frame, that our YIN and the package's agree.
  pitch_detector_dart: ^0.0.7
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icon/
    # Spotify's Basic Pitch (ICASSP 2022), Apache-2.0 — 225 KB. Polyphonic
    # note transcription, which the tuner's own detector cannot do at all.
    - assets/models/

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
    # macOS does NOT mask the icon, so it needs the rounded squircle baked in
    # with a transparent margin. iOS/Android supply their own mask and Apple
    # rejects any alpha channel in the 1024px marketing icon.
    image_path: "assets/icon/app_icon_macos.png"
  windows:
    generate: true
  linux:
    generate: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#FBF1DE"
    theme_color: "#9A6413"
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#FBF1DE"
  # Apple rejects any alpha channel in the 1024px marketing icon (ITMS-90717),
  # even a fully-opaque one. Belt and braces alongside the RGB master.
  remove_alpha_ios: true
