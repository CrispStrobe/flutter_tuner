name: flutter_tuner
description: "CrispTuner — a chromatic instrument tuner with historical temperaments, alternate and custom tunings, live pitch detection and spectrum analysis."
publish_to: 'none'
version: 2.2.0+6

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Core audio (mobile)
  record: ^6.0.0
  pitch_detector_dart: ^0.0.7
  fftea: ^1.5.0
  flutter_pcm_sound: ^3.3.3

  # Utilities
  collection: ^1.18.0
  intl: any
  package_info_plus: ^8.0.0
  shared_preferences: ^2.2.2
  # Web support
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
    # macOS does NOT mask the icon, so it needs the rounded squircle baked in
    # with a transparent margin. iOS/Android supply their own mask and Apple
    # rejects any alpha channel in the 1024px marketing icon.
    image_path: "assets/icon/app_icon_macos.png"
  windows:
    generate: true
  linux:
    generate: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#FBF1DE"
    theme_color: "#9A6413"
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#FBF1DE"
  # Apple rejects any alpha channel in the 1024px marketing icon (ITMS-90717),
  # even a fully-opaque one. Belt and braces alongside the RGB master.
  remove_alpha_ios: true
